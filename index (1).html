<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilemma — Would You Rather</title>
<style>
:root{--bg:#f7f1e3;--card:#ffffff;--line:#e6dcc3;--gold:#0f6b54;--gold2:#b8912f;--wine:#b8912f;--txt:#1c2b26;--mut:#6b7a73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#fffaf0,#f1e8d2 65%);color:var(--txt);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-weight:normal;margin:0}
.logo{text-align:center;letter-spacing:.35em;color:var(--gold);font-size:14px;margin:8px 0 4px}
.title{text-align:center;font-size:34px;background:linear-gradient(90deg,#0f6b54,#b8912f,#0f6b54);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{text-align:center;color:var(--mut);font-style:italic;margin-bottom:22px}
.btn{background:linear-gradient(135deg,#0f6b54,#18886a);color:#fff;border:0;padding:13px 22px;border-radius:12px;font-family:inherit;font-size:16px;cursor:pointer;font-weight:bold}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.plans{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.plan{border:1px solid var(--gold2);border-radius:16px;padding:16px;text-align:center;position:relative}
.plan .p{font-size:30px;color:var(--gold)}
.badge{position:absolute;top:-10px;right:10px;background:var(--wine);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--mut)}
.tag{color:var(--gold);border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut);font-family:inherit;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold)}
.opt{width:100%;display:block;text-align:left;background:linear-gradient(160deg,#ffffff,#fbf6e9);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:18px;margin-bottom:10px;font-family:inherit;font-size:18px;cursor:pointer;position:relative;overflow:hidden}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(15,107,84,.15);width:0;transition:width .8s}
.opt.pick{border-color:var(--gold)}
.opt span{position:relative}
.pct{float:right;color:var(--gold)}
.or{text-align:center;color:var(--gold);letter-spacing:.3em;margin:2px 0 10px;font-size:13px}
.cm{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.cm b{color:var(--gold)} .cm small{color:var(--mut)}
input,textarea{width:100%;background:#fffdf7;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-family:inherit;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.quest{text-align:center;font-size:20px;padding:10px 0 18px;line-height:1.4}
.hide{display:none}
.lock{text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q=[
["Know the exact date you'll die","Know the exact reason you'll die","Philosophy"],
["Lose all your memories every year but be happy","Keep every memory but be haunted by the worst ones","Mind"],
["Be famous for something you hate","Be unknown while doing what you love","Life"],
["Read everyone's thoughts for 1 minute a day","Have everyone read yours for 1 minute a day","Spicy"],
["Marry your soulmate but be poor forever","Marry a stranger and be rich forever","Love"],
["Relive your best day forever","Skip to a perfect future and forget your past","Mind"],
["Always say what you think","Never be able to say what you feel","Social"],
["Save 5 strangers by sacrificing your best friend","Save your best friend and let 5 strangers go","Moral"],
["Have unlimited money but no free time","Have unlimited time but a tiny income","Money"],
["Lose your phone forever","Lose your ability to travel forever","Life"],
["Your secret exposed to the world","A stranger's life ruined by your lie","Spicy"],
["Be the smartest person alive and lonely","Be average and surrounded by love","Mind"]];
const TRUTH=["What's the most expensive lie you've ever told?","Who in your life do you secretly envy?","What's a secret you'd never tell your parents?","What's the boldest thing you've done for love?"];
const DARE=["Send a voice note singing to your best friend.","Post a childhood photo with a dramatic caption.","Text someone you miss: 'thinking of you'.","Do 10 jumping jacks while saying your biggest dream out loud."];
const NAMES=["Aria","Kenji","Lucía","Omar","Zoe","Dev","Mila","Jon","Amara","Yuki"],LOC=["Mumbai","Tokyo","Madrid","Cairo","Lagos","Toronto","Seoul","Paris","Dubai","Sydney"];
const CM=["Tough one, I went with my gut.","Anyone saying the other side is lying.","I changed my mind three times.","My partner disagrees completely 😂","This one kept me up at night.","Honestly easy for me.","Ask me again tomorrow."];
let S={user:null,i:0,pick:null,tab:"play",plan:null,seed:[],mine:{},votes:{},coms:{}};
const $=h=>document.getElementById("app").innerHTML=h;
const rnd=n=>Math.floor(Math.random()*n);
function trialLeft(){return S.user&&S.user.trialEnd?Math.max(0,S.user.trialEnd-Date.now()):0}
function active(){return S.user&&(S.user.guest||S.user.plan||trialLeft()>0)}
function home(){
$(`<div class="logo">◆ DILEMMA ◆</div><h1 class="title">Would You Rather</h1><p class="sub">Choices too hard to make. Opinions from the whole world.</p>
<div class="card"><h3 style="color:var(--gold);margin-bottom:12px">Choose your access</h3>
<div class="plans"><div class="plan"><div>Monthly</div><div class="p">₹150</div><small>per month</small></div>
<div class="plan"><span class="badge">BEST VALUE</span><div>Yearly</div><div class="p">₹999</div><small>per year</small></div></div>
<div style="display:grid;gap:10px;margin-top:16px">
<button class="btn" onclick="trial()">Start 1-day free trial</button>
<button class="btn ghost" onclick="subs()">Subscribe</button>
<button class="btn ghost" onclick="guest()">Continue as guest</button></div>
<p class="lock" style="font-size:13px">Guests get 3 dilemmas a day. Trial & members get unlimited dilemmas, comments and side quests.</p></div>`)}
function trial(){S.user={name:"Member",trialEnd:Date.now()+864e5};go()}
function guest(){S.user={name:"Guest",guest:true,left:3};go()}
function subs(){
$(`<div class="logo">◆ DILEMMA ◆</div><h2 class="title" style="font-size:26px">Subscribe</h2>
<div class="card"><div class="plans"><div class="plan"><div>Monthly</div><div class="p">₹150</div><button class="btn" style="margin-top:10px" onclick="buy('Monthly')">Choose</button></div>
<div class="plan"><span class="badge">SAVE 45%</span><div>Yearly</div><div class="p">₹999</div><button class="btn" style="margin-top:10px" onclick="buy('Yearly')">Choose</button></div></div>
<p class="lock" style="font-size:13px">Demo checkout: connect a payment gateway (e.g. Razorpay) to charge for real.</p>
<button class="btn ghost" onclick="home()">Back</button></div>`)}
function buy(p){S.user={name:"Member",plan:p};go()}
function go(){S.i=rnd(Q.length);S.pick=null;S.tab="play";render()}
function render(){
if(!active()){return $(`<div class="card lock"><h2 style="color:var(--gold)">Trial ended</h2><p>Subscribe to keep playing.</p><button class="btn" onclick="subs()">Subscribe</button></div>`)}
const u=S.user,t=trialLeft();
let top=`<div class="bar"><span class="tag">${u.guest?"Guest · "+u.left+" left today":u.plan?u.plan+" member":"Trial · "+Math.ceil(t/36e5)+"h left"}</span><button class="tab" style="flex:none;padding:6px 12px" onclick="home()">Exit</button></div>
<h1 class="title" style="font-size:26px">Would You Rather</h1>
<div class="tabs"><button class="tab ${S.tab=="play"?"on":""}" onclick="S.tab='play';render()">Dilemma</button><button class="tab ${S.tab=="quest"?"on":""}" onclick="S.tab='quest';render()">Side Quests 🔥</button></div>`;
$(top+(S.tab=="play"?play():quest()))}
function play(){
const q=Q[S.i],k=q[0],v=S.votes[S.i]||(S.votes[S.i]=[30+rnd(40),0]);
if(!S.coms[S.i])S.coms[S.i]=Array.from({length:4},()=>({n:NAMES[rnd(10)],l:LOC[rnd(10)],t:CM[rnd(7)],s:rnd(2)}));
let h=`<div class="bar"><span class="tag">${q[2]}</span><span>Question ${S.i+1}/${Q.length}</span></div>`;
const done=S.pick!==null,a=v[0],b=100-a;
h+=`<button class="opt ${S.pick===0?"pick":""}" ${done?"disabled":""} onclick="choose(0)"><div class="fill" style="width:${done?a:0}%"></div><span>${q[0]}</span>${done?`<span class="pct">${a}%</span>`:""}</button><div class="or">— OR —</div>
<button class="opt ${S.pick===1?"pick":""}" ${done?"disabled":""} onclick="choose(1)"><div class="fill" style="width:${done?b:0}%"></div><span>${q[1]}</span>${done?`<span class="pct">${b}%</span>`:""}</button>`;
if(!done)return h+`<p class="lock">🔒 Comments from around the world unlock after you choose.</p>`;
h+=`<div class="card"><h3 style="color:var(--gold);margin-bottom:6px">🌍 Worldwide comments</h3>`+S.coms[S.i].map(c=>`<div class="cm"><b>${c.n}</b> <small>${c.l} · chose ${c.s?"B":"A"}</small><br>${c.t}</div>`).join("")+
`<div class="row"><input id="ci" placeholder="Add your comment…"><button class="btn" onclick="addC()">Post</button></div></div>
<button class="btn" style="width:100%" onclick="next()">Next dilemma →</button>`;return h}
function choose(i){S.pick=i;const v=S.votes[S.i];v[0]=Math.min(90,Math.max(10,i==0?v[0]+1:v[0]-1));
if(S.user.guest)S.user.left--;render()}
function addC(){const e=document.getElementById("ci");if(!e.value.trim())return;S.coms[S.i].unshift({n:"You",l:"Your city",t:e.value.trim().slice(0,200),s:S.pick});render()}
function next(){
if(S.user.guest&&S.user.left<=0){return $(`<div class="card lock"><h2 style="color:var(--gold)">Daily guest limit reached</h2><p>Start the free trial or subscribe for unlimited dilemmas.</p><button class="btn" onclick="trial()">Free 1-day trial</button> <button class="btn ghost" onclick="subs()">Subscribe</button></div>`)}
let n;do{n=rnd(Q.length)}while(n==S.i&&Q.length>1);S.i=n;S.pick=null;render()}
function quest(){
if(S.user.guest)return `<div class="card lock"><h3 style="color:var(--gold)">Members only</h3><p>Spicy Truth & Dare quests unlock with the trial or a subscription.</p><button class="btn" onclick="trial()">Start free trial</button></div>`;
return `<div class="card"><div class="quest" id="qt">Pick your poison…</div><div class="row"><button class="btn" style="flex:1" onclick="q('T')">Truth</button><button class="btn ghost" style="flex:1" onclick="q('D')">Dare</button></div></div>`}
function q(t){const a=t=="T"?TRUTH:DARE;document.getElementById("qt").innerHTML=(t=="T"?"💬 <b>Truth</b><br>":"🔥 <b>Dare</b><br>")+a[rnd(a.length)]}
home();
</script>
</body>
</html>
